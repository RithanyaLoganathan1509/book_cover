{% load static %}
<html>

<head>
    <title>Book Cover</title>
    <style>
        .bg {
            position: relative;
            background-image: url("{% static 'green.jpeg' %}");
            border: 2px solid black;
            height: 100%;
            width: 35%;
            margin-left: 33%;
        }

        .sticker {
            position: absolute;
            left: 5%;
            top: 3%;
            border-radius: 100%;
            background-color: #6b9071;
            border: 3px solid #6b9071;
            height: 16%;
            width: 22%;
            text-align: center;

        }

       .bg h6 {
            position: absolute;
            margin-top: 7%;
            color: white;
            font-size: 12px;
            line-height: 20px;
            letter-spacing: 13x;
            right: 5%;
        }

        .bg img {
            position: absolute;
            height: 50%;
            width: auto;
            right: -5%;
            top: 23%;

        }

        .bg pre {
            position: absolute;
            font-size: 40px;
            font-family: Georgia, 'Times New Roman', Times, serif;
            line-height: 70px;
            letter-spacing: 10px;
            top: 20%;
            left: -110px;
        }

        .bg h5 {
            position: absolute;
            bottom: 0%;
            left: 30%;
            font-size: 20px;
            letter-spacing: 5px;
            font-family: serif;
            font-weight: 100;
        }

        .bg h4 {
            position: absolute;
            bottom: 13%;
            left: 8%;
            font-size: 22px;
            line-height: 30px;
            letter-spacing: 3px;
            word-spacing: 3px;
            font-style: italic;
            font-family: 'Times New Roman', Times, serif;
            font-weight: lighter;
        }
    </style>
</head>

<body>
    <div class="bg">
        <PRE>
        THE 
        COURAGE 
        TO BE 
        DISLIKED
        </PRE>
        <img src="{% static 'waves.png' %}">
        <div class="sticker">
            <h6>
                THE<br>
                INTERNATIONAL<br>
                BEST
                SELLER<br>
                3M
                COPIES <br>
                SOLD
            </h6>
        </div>
        <h4>"The Japanese Phenomenon That<br>
            Shows You How to Change Your Life <br>
            and Achieve Real Happiness"</h4>
        <h5>ICHIRO KISHIMI</h5>
    </div>
</body>

</html>
